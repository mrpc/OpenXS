name: Update Roundcube checksums bundle

on:
  schedule:
    - cron: '50 6 * * 1'  # weekly, Monday 06:50 UTC (offset from the other checksum jobs)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Fetch any newly tagged Roundcube versions' checksums
        run: python3 tools/build_roundcube_checksums_bundle.py

      - name: Commit new files, if any
        run: |
          git config user.name "openxs-bot"
          git config user.email "noreply@users.noreply.github.com"
          git add tools/roundcube_checksums/
          git diff --cached --quiet && echo "Nothing new." && exit 0
          git commit -m "Add newly tagged Roundcube version(s) to the checksums bundle"
          git push origin main
