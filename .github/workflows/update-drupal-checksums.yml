name: Update Drupal checksums bundle

on:
  schedule:
    - cron: '20 6 * * 1'  # weekly, Monday 06:20 UTC (offset from the WordPress job)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Fetch any newly released Drupal 7.x versions' checksums
        run: python3 tools/build_drupal_checksums_bundle.py

      - name: Commit new files, if any
        run: |
          git config user.name "openxs-bot"
          git config user.email "noreply@users.noreply.github.com"
          git add tools/drupal_checksums/
          git diff --cached --quiet && echo "Nothing new." && exit 0
          git commit -m "Add newly released Drupal 7.x version(s) to the checksums bundle"
          git push origin main
