name: Update Drupal checksums bundle

on:
  schedule:
    - cron: '20 6 * * 1'  # weekly, Monday 06:20 UTC (offset from the WordPress job)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # A real PAT (not the default GITHUB_TOKEN) so the resulting push/PR
      # triggers CI normally and the "test (3.12)" required status check
      # actually lands on this PR - GITHUB_TOKEN-authored pushes/PRs never
      # trigger other workflows (GitHub's anti-recursion rule), so the
      # required check would otherwise never run and auto-merge would
      # never fire. See OpenXS-ops/TIMELINE.md 2026-10-30.
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.OPENXS_BOT_PAT }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Fetch any newly released Drupal 7.x versions' checksums
        run: python3 tools/build_drupal_checksums_bundle.py

      - name: Open PR with new files, if any
        env:
          GH_TOKEN: ${{ secrets.OPENXS_BOT_PAT }}
        run: |
          git config user.name "openxs-bot"
          git config user.email "noreply@users.noreply.github.com"
          git add tools/drupal_checksums/
          git diff --cached --quiet && echo "Nothing new." && exit 0
          BRANCH="bot/update-drupal-checksums-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git commit -m "Add newly released Drupal 7.x version(s) to the checksums bundle"
          git push origin "$BRANCH"
          # main requires the "test (3.12)" status check - a direct push is
          # rejected (GH006), so open a PR and let auto-merge land it once
          # CI passes instead.
          gh pr create --title "Add newly released Drupal 7.x version(s) to the checksums bundle" \
            --body "Automated weekly checksum bundle update. Auto-merges once CI passes." \
            --base main --head "$BRANCH"
          gh pr merge "$BRANCH" --auto --squash
