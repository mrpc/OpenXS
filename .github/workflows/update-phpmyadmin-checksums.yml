name: Update phpMyAdmin checksums bundle

on:
  schedule:
    - cron: '0 7 * * 1'  # weekly, Monday 07:00 UTC (offset from the other checksum jobs)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Fetch any newly tagged phpMyAdmin versions' checksums
        run: python3 tools/build_phpmyadmin_checksums_bundle.py

      - name: Open PR with new files, if any
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "openxs-bot"
          git config user.email "noreply@users.noreply.github.com"
          git add tools/phpmyadmin_checksums/
          git diff --cached --quiet && echo "Nothing new." && exit 0
          BRANCH="bot/update-phpmyadmin-checksums-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git commit -m "Add newly tagged phpMyAdmin version(s) to the checksums bundle"
          git push origin "$BRANCH"
          # main requires the "test (3.12)" status check - a direct push is
          # rejected (GH006), so open a PR and let auto-merge land it once
          # CI passes instead.
          gh pr create --title "Add newly tagged phpMyAdmin version(s) to the checksums bundle" \
            --body "Automated weekly checksum bundle update. Auto-merges once CI passes." \
            --base main --head "$BRANCH"
          gh pr merge "$BRANCH" --auto --squash
