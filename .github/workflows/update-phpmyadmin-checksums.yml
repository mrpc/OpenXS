name: Update phpMyAdmin checksums bundle

on:
  schedule:
    - cron: '0 7 * * 1'  # weekly, Monday 07:00 UTC (offset from the other checksum jobs)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Fetch any newly tagged phpMyAdmin versions' checksums
        run: python3 tools/build_phpmyadmin_checksums_bundle.py

      - name: Commit new files, if any
        run: |
          git config user.name "openxs-bot"
          git config user.email "noreply@users.noreply.github.com"
          git add tools/phpmyadmin_checksums/
          git diff --cached --quiet && echo "Nothing new." && exit 0
          git commit -m "Add newly tagged phpMyAdmin version(s) to the checksums bundle"
          git push origin main
