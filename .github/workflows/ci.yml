name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest
      - run: python3 -m pytest tests/ -v
      - name: Syntax-check shell scripts
        run: |
          for f in install.sh entrypoint.sh tools/*.sh; do bash -n "$f" || exit 1; done

  # webmin/openxs/*.cgi each `require` openxs-lib.pl, which `use`s
  # WebminCore - a module that only exists inside a real Webmin install,
  # so a real check means building the project's own sandbox Dockerfile.
  # Tried that as its own CI job; dropped it - the full image (apache2 +
  # clamav + modsecurity + webmin + fetching forks) is too slow/flaky to
  # run on every push (one real run hung over an hour, likely on
  # clamav-freshclam's DB download). CONTRIBUTING.md's documented manual
  # sandbox-test step before any Perl change already covers this.
