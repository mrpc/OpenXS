name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest
      - run: python3 -m pytest tests/ -v
      - name: Syntax-check shell scripts
        run: |
          for f in install.sh entrypoint.sh tools/*.sh; do bash -n "$f" || exit 1; done

  # webmin/openxs/*.cgi each `require` openxs-lib.pl, which `use`s
  # WebminCore - a module that only exists inside a real Webmin install,
  # not a bare runner. `perl -c` can't meaningfully check these without
  # one, so this builds the project's own sandbox Dockerfile (the same
  # image used for manual testing throughout development) and runs the
  # syntax check from inside it, where WebminCore genuinely exists.
  perl-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t openxs-ci .
      - run: |
          docker run --rm openxs-ci bash -c \
            'for f in /usr/share/webmin/openxs/*.cgi; do perl -c "$f" || exit 1; done'
