# ============================================================================
# wp-upgrade-rce — ModSecurity Rule
# CVE-2026-119977
#
# WordPress core TOCTOU RCE via the update staging path
# (wp-content/upgrade/): during a core update, WP briefly writes PHP there;
# an attacker who wins the race can drop (and later request) their own file
# in that same window. Legitimate clients never request anything under
# wp-content/upgrade/ directly - WP only reads/includes it from PHP
# internally during an update - so blocking direct HTTP access there is
# safe regardless of WP core version, including installs too old to ever
# be updated past the fix (7.1.4).
#
# Rule ID range: 9900200 - 9900200
# Reference: https://cyber.gc.ca/en/alerts-advisories/bulletin-wordpress-av26-1117
# ============================================================================

SecRule REQUEST_FILENAME "@rx /wp-content/upgrade/" \
"id:9900200, \
phase:1, \
t:none,t:urlDecodeUni,t:normalizePath, \
deny, \
status:403, \
log, \
msg:'wp-upgrade-rce: direct request to wp-content/upgrade/ (CVE-2026-119977 staging path)', \
tag:'CVE-2026-119977', \
tag:'wp-upgrade-rce', \
severity:'CRITICAL'"
